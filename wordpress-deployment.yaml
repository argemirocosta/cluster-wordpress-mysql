apiVersion: apps/v1
kind: Deployment
metadata:
  name:  wordpress-deployment
  namespace: default
  labels:
    app:  wordpress-deployment
spec:
  selector:
    matchLabels:
      app: wordpress-deployment
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app:  wordpress-deployment
    spec:
      containers:
      - name:  wordpress-image
        image:  wordpress:6-apache
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1024Mi
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /license.txt
            port: 80
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        env:
        - name: TZ
          value: America/Sao_Paulo
        - name: WORDPRESS_DB_HOST
          value: mysql
        - name: WORDPRESS_DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: user
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
        - name: WORDPRESS_DB_NAME
          value: wordpress
        # Derive the site URL from the request host, so it works behind any
        # minikube tunnel / port-forward port instead of the one stored in the DB.
        - name: WORDPRESS_CONFIG_EXTRA
          value: |
            define('WP_HOME', 'http://' . $_SERVER['HTTP_HOST']);
            define('WP_SITEURL', 'http://' . $_SERVER['HTTP_HOST']);
        ports:
        - containerPort: 80
          name: wordpress
        volumeMounts:
        - name: wordpress-data
          mountPath: /var/www/html
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-pvc
      restartPolicy: Always
