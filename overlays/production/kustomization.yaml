apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every resource from the base is moved into this namespace.
namespace: wordpress-production

resources:
  - ../../base
  - namespace.yaml

# Label all resources with the environment.
labels:
  - pairs:
      environment: production

# CPU/memory requests and limits are inherited from the base unchanged.
patches:
  - path: replicas-patch.yaml
  - path: storage-patch.yaml
  - path: hpa-patch.yaml
