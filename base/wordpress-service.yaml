apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: default
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: wordpress-stack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: wordpress
  ports:
  - port: 80
    targetPort: 80
    name: wordpress
